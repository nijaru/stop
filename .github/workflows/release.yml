name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in Cargo.toml, without leading v (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "releases must run from main" >&2
            exit 1
          fi
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq 'any(.[]; .conclusion == "success")')
          if [ "$passed" != true ]; then
            echo "CI must pass for $GITHUB_SHA before releasing" >&2
            exit 1
          fi
          existing_tags=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if [ -n "$existing_tags" ]; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Validate version and resolve dependencies
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "Cargo.toml version $manifest_version does not match input $VERSION" >&2
            exit 1
          fi
          cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release --verbose

      - name: Verify binary version
        run: test "$(target/release/stop --version)" = "stop $VERSION"

      - name: Verify package and installation
        run: bash scripts/check-package.sh

      - name: Publish dry run
        run: cargo publish --locked --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          gh auth setup-git
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
