name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # The MSRV job must override rust-toolchain.toml's development channel.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, '1.95.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      # Cargo.lock is deliberately untracked. Resolve afresh, then use the same
      # dependency graph for every check within this job.
      - name: Resolve dependencies
        run: cargo generate-lockfile

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Run clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Build release
        run: cargo build --locked --release --verbose

      - name: Verify package and installation
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: bash scripts/check-package.sh
